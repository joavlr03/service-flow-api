services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: serviceflow
      MYSQL_USER: serviceflow
      MYSQL_PASSWORD: serviceflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - serviceflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-userviceflow", "-pserviceflow"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  serviceflow_mysql:
