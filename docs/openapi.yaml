openapi: 3.0.3
info:
  title: ServiceFlow API
  version: "2.0"
  description: Contrato inicial da API REST do ServiceFlow.
servers:
  - url: http://localhost:9000
tags:
  - name: Autenticação
  - name: Configuração inicial
  - name: Empresa
paths:
  /api/v2/setup/status:
    get:
      tags: [Configuração inicial]
      summary: Consultar se o primeiro cadastro está disponível
      security: []
      responses:
        '200':
          description: Estado do cadastro inicial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
  /api/v2/setup:
    post:
      tags: [Configuração inicial]
      summary: Cadastrar a empresa e seu primeiro proprietário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Cadastro inicial concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResponse'
        '409':
          description: O cadastro inicial já foi concluído
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v2/auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v2/auth/me:
    get:
      tags: [Autenticação]
      summary: Consultar usuário autenticado
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/empresa:
    get:
      tags: [Empresa]
      summary: Consultar a empresa do usuário autenticado
      responses:
        '200':
          description: Dados da empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v2/empresa/tema:
    put:
      tags: [Empresa]
      summary: Alterar a cor de destaque do app da empresa (somente ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#2563EB' }
      responses:
        '200':
          description: Empresa com a cor atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '422':
          description: Cor fora do formato #RRGGBB
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuário não é ADMIN
  /api/v2/categorias:
    get:
      tags: [Categorias]
      summary: Listar as categorias da empresa (somente ADMIN)
      parameters:
        - { name: tipo, in: query, schema: { type: string, enum: [DESPESA, ENTRADA], default: DESPESA } }
      responses:
        '200':
          description: Categorias ordenadas por nome
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
    post:
      tags: [Categorias]
      summary: Criar categoria (somente ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { description: Categoria criada }
        '422': { description: Nome vazio, maior que 40 caracteres ou repetido }
  /api/v2/categorias/{id}:
    put:
      tags: [Categorias]
      summary: Renomear ou ativar/desativar (somente ADMIN); renomear também troca o nome nas despesas já lançadas
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { description: Categoria atualizada }
        '404': { description: Categoria não existe nesta empresa }
        '422': { description: Nome repetido }
    delete:
      tags: [Categorias]
      summary: Excluir categoria sem despesas (somente ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Excluída }
        '422': { description: Categoria usada em lançamentos; desative-a em vez de excluir }
  /api/v2/entradas:
    get:
      tags: [Entradas]
      summary: Listar entradas avulsas do período (somente ADMIN; máx. 366 dias)
      parameters:
        - { name: dataInicial, in: query, required: true, schema: { type: string, format: date } }
        - { name: dataFinal, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Entradas da mais recente para a mais antiga
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Income' } }
    post:
      tags: [Entradas]
      summary: Registrar entrada avulsa (receita sem atendimento); soma na receita do /financeiro/resumo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeInput' }
      responses:
        '200': { description: Entrada criada }
        '422': { description: Descrição vazia, valor não positivo ou categoria com mais de 40 caracteres }
  /api/v2/entradas/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get: { tags: [Entradas], summary: Buscar entrada, responses: { '200': { description: Entrada }, '404': { description: Não existe nesta empresa } } }
    put:
      tags: [Entradas]
      summary: Editar entrada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeInput' }
      responses: { '200': { description: Entrada atualizada }, '404': { description: Não existe nesta empresa } }
    delete: { tags: [Entradas], summary: Excluir entrada, responses: { '204': { description: Excluída }, '404': { description: Não existe nesta empresa } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 40 }
        type: { type: string, enum: [DESPESA, ENTRADA] }
        active: { type: boolean }
    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 40, example: Marketing }
        type: { type: string, enum: [DESPESA, ENTRADA] }
        active: { type: boolean, default: true }
    IncomeInput:
      type: object
      required: [description, category, amount, date]
      properties:
        description: { type: string, maxLength: 180, example: Venda de cera }
        category: { type: string, maxLength: 40, example: Venda de produto }
        amount: { type: number, minimum: 0.01, example: 40.5 }
        date: { type: string, format: date }
        notes: { type: string, maxLength: 1000 }
    Income:
      allOf:
        - $ref: '#/components/schemas/IncomeInput'
        - type: object
          properties:
            id: { type: integer }
    SetupStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
    SetupRequest:
      type: object
      required: [companyName, segment, ownerName, email, password]
      properties:
        companyName: { type: string, maxLength: 150 }
        segment: { type: string, maxLength: 100 }
        ownerName: { type: string, maxLength: 150 }
        email:
          type: string
          description: E-mail recomendado ou outro identificador único de acesso
          maxLength: 180
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
    SetupResponse:
      type: object
      properties:
        companyId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        ownerName: { type: string }
        email: { type: string }
        role: { type: string, example: ADMIN }
        status: { type: string, example: ACTIVE }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: E-mail ou identificador de acesso
          example: admin@brilhototal.com.br
        password:
          type: string
          format: password
          example: SenhaForte@2026
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, format: int64, example: 900 }
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        companyId: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, description: E-mail ou identificador de acesso }
        role: { type: string, enum: [ADMIN, ATENDENTE, FINANCEIRO] }
    Company:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        segment: { type: string }
        ownerName: { type: string }
        email: { type: string, description: E-mail ou identificador de acesso }
        plan: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        themeColor: { type: string, nullable: true, example: '#2563EB', description: Cor de destaque do app em hex; null = cor padrão }
    ApiError:
      type: object
      properties:
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        timestamp: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Credenciais ou token inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
security:
  - bearerAuth: []
