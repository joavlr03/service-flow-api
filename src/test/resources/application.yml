spring:
  datasource:
    url: jdbc:h2:mem:serviceflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  mail:
    enabled: false
  test-data:
    enabled: true
  security:
    jwt-secret: test-secret-with-at-least-thirty-two-characters
    access-token-minutes: 15
    expose-reset-token: true
    rate-limit:
      auth-attempts: 100
      window-minutes: 15
  cors:
    allowed-origins: http://localhost:5173
