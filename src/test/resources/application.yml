BOOTSTRAP_ADMIN_EMAIL: admin@brilhototal.com.br
BOOTSTRAP_ADMIN_PASSWORD: AdminTest@123
spring:
  datasource:
    url: jdbc:h2:mem:serviceflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  mail:
    enabled: false
  bootstrap:
    enabled: true
    admin-email: admin@brilhototal.com.br
    admin-password: AdminTest@123
  setup:
    key: test-setup-key-with-at-least-32-characters
  security:
    jwt-secret: test-secret-with-at-least-thirty-two-characters
    access-token-minutes: 15
    expose-reset-token: true
    rate-limit:
      auth-attempts: 100
      window-minutes: 15
  cors:
    allowed-origins: http://localhost:5173
